name: moonrizon

# Server di produzione (VM Oracle o qualsiasi VPS): backend + Caddy con HTTPS automatico.
# Dalla radice del repository:
#   cp deploy/.env.prod.example deploy/.env.prod   (e compilarlo)
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: moonrizon-backend:prod
    restart: unless-stopped
    environment:
      MEOWRIZON_DATA_DIR: /app/data
      CORS_ORIGINS: ${CORS_ORIGINS}
      HTTP_TIMEOUT_S: ${HTTP_TIMEOUT_S:-60}
    volumes:
      # Catalogo regioni/siti (cartella "data" della radice del repository).
      - ${DATA_ROOT:-/opt/moonrizon}/catalog-data:/app/data
      # Dati del motore: terreno, effemeridi, job, risultati e cache delle misure.
      - ${DATA_ROOT:-/opt/moonrizon}/engine-data:/app/backend/data
      - ${DATA_ROOT:-/opt/moonrizon}/engine-cache:/app/backend/cache
    # Un solo worker: i job scientifici e il lock dei dati sono per processo.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips", "*"]
    expose:
      - "8000"
    mem_limit: ${BACKEND_MEM_LIMIT:-4g}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
